const wait=[];urls.forEach(u=>{if(!u||/^data:/.test(u)||u.indexOf('undefined')>=0)return;let r=_loaded.get(u);if(!r){const im=new Image();r={im,done:false};_loaded.set(u,r);const f=()=>{r.done=true};im.onload=im.onerror=f;im.src=u;if(im.complete)r.done=true}if(!r.done)wait.push(r)});
const tok=++_gateTok;if(!wait.length){app.style.visibility='';return}
app.style.visibility='hidden';const t0=performance.now();(function chk(){if(tok!==_gateTok)return;if(wait.every(r=>r.done)||performance.now()-t0>4000){app.style.visibility='';return}setTimeout(chk,50)})()}

});

 if(act==='buy'){const it=FS.shop[shopTab].items[Number(value)];shopMsg=it.amount?(TEST_FREE_TOPUP?(data.stone=(data.stone||0)+it.amount,'測試期間免費入帳 '+it.amount.toLocaleString('en-US')+' 靈石（原價 '+it.price+'），目前靈石 '+data.stone.toLocaleString('en-US')+'。'):'購買 '+it.amount.toLocaleString('en-US')+' 靈石（'+it.price+'）尚未開放。'):'「'+it.name+'」尚未開放。'}

 if(act==='pull'){
