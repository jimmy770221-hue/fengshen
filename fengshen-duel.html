{const sp=new URLSearchParams(location.search).get('skills');

});

});

// 手指/滑鼠拖曳畫面左右捲動（鏡頭只看 1000 寬的一段世界）
{let drag=null;

 if(id==='ward'||id==='haste'||id==='rage')return team.length>0;
 if(id==='heal')return s.hp[0]<maxHP||team.some(a=>a.hp<a.maxHP);
 if(id==='energy')return s.energy<s.cap;
 return foes.length>0;
}
function cast(i){
 if(!s.started||s.paused||s.over||!loadout.includes(i)||s.used[i])return;
 const [id,name,,color]=skills[i], foes=enemies().sort((a,b)=>a.x-b.x), team=allies();
 if(!canCast(id,foes,team))return;

 if(id==='ward')s.shield=7;
 else if(id==='haste')s.haste=7;
 else if(id==='rage')s.rage=6;
 else if(id==='energy')s.energy=Math.min(s.cap,s.energy+60);
 else if(id==='heal'){
  s.hp[0]=Math.min(maxHP,s.hp[0]+160);
  for(const a of team)a.hp=Math.min(a.maxHP,a.hp+Math.ceil(a.maxHP*.55));
 }else{
  const front=foes[0];
  const nearby=foes.filter(a=>a.x-front.x<=130);
  let targets=nearby;
  if(id==='poison'||id==='slow')targets=foes;
  if(id==='shock')targets=[front];
  if(id==='thunder'){
   targets=[front];
   for(const a of foes.slice(1)){
    if(targets.length===3||a.x-targets.at(-1).x>140)break;
    targets.push(a);
   }
  }
  targets.forEach((a,j)=>{
   if(id==='wind'){a.x=Math.min(right-32,a.x+100);a.hp-=30;}
   if(id==='fire'){a.hp-=85;a.burn=4;}
   if(id==='thunder')a.hp-=[95,70,50][j];
   if(id==='shock'){a.hp-=30;a.stun=Math.max(a.stun,4);}
   if(id==='ice'){a.hp-=25;a.stun=Math.max(a.stun,2);}
   if(id==='poison')a.poison=7;
   if(id==='slow')a.slowTime=Math.max(a.slowTime,6);
   a.hit=.22;
   s.fx.push({x:a.x-25,to:a.x,life:.28,color,burst:true});
  });

}

}

});

function update(dt){
 if(!s.started||s.paused||s.over)return;
 s.time+=dt;s.haste=Math.max(0,s.haste-dt);s.rage=Math.max(0,s.rage-dt);s.shield=Math.max(0,s.shield-dt);s.noticeTime=Math.max(0,s.noticeTime-dt);s.energy=Math.min(s.cap,s.energy+dt*(8+(s.level-1)*3));
 s.cd=s.cd.map(t=>Math.max(0,t-dt));s.spawn-=dt;

  const index=Math.floor(Math.random()*4);
  const u=opposingUnits[index], strength=1;
  spawn({...u,name:storyMode?u.name:['風靈','岩衛','火靈','弓衛'][index],hp:Math.round(u.hp*strength*DIFF.hp),damage:Math.round(u.damage*strength*DIFF.dmg),color:['#bca8eb','#9aa4bb','#e899ce','#a1b4e8'][index]},1);

 }
 for(const a of s.actors){
  if(a.hp<=0)continue;
  a.hp-=Math.min(dt,a.burn)*12+Math.min(dt,a.poison)*a.maxHP*.04;
  a.burn=Math.max(0,a.burn-dt);a.poison=Math.max(0,a.poison-dt);
  if(a.hp<=0)continue;
  const stunned=a.stun>0;
  a.stun=Math.max(0,a.stun-dt);
  const raging=a.side===0&&s.rage>0;
  const damage=a.damage*(raging?1.5:1);
  a.wait-=dt*(raging?1.35:1);a.slowTime=Math.max(0,a.slowTime-dt);a.hit=Math.max(0,a.hit-dt);a.swing=Math.max(0,a.swing-dt);
  if(stunned)continue;
  const direction=a.side?-1:1;
  const opponents=s.actors.filter(b=>b.side!==a.side&&b.hp>0);
  const target=opponents.reduce((best,b)=>!best||Math.abs(b.x-a.x)<Math.abs(best.x-a.x)?b:best,null);
  const enemyBase=a.side?left:right;
  const near=target&&Math.abs(target.x-a.x)<=a.range;
  const atBase=Math.abs(enemyBase-a.x)<=a.range;
  const wounded=a.heal&&s.actors
   .filter(b=>b.side===a.side&&b!==a&&b.hp>0&&b.hp<b.maxHP&&Math.abs(b.x-a.x)<=a.range)
   .sort((b,c)=>b.hp/b.maxHP-c.hp/c.maxHP)[0];
  if(wounded&&a.wait<=0){
   wounded.hp=Math.min(wounded.maxHP,wounded.hp+a.heal);
   a.wait=a.period;a.swing=.24;
   s.fx.push({x:a.x,to:wounded.x,life:.28,color:'#91e5ac',burst:true});
   continue;
  }
  if(near||atBase){
   if(a.wait>0)continue;
   a.wait=a.period;a.swing=.24;a.aim=near?target.x:enemyBase;
   if(near){
    const victims=a.splash?opponents.filter(b=>Math.abs(b.x-target.x)<=a.splash):[target];

   }else s.hp[1-a.side]=Math.max(0,s.hp[1-a.side]-damage);
   s.fx.push({x:a.x,to:near?target.x:enemyBase,life:.28,color:a.color,burst:!!a.splash,noLine:!!a.art});
   if(s.hp[1-a.side]===0){s.over=sideNames[a.side]+'獲勝';s.won=a.side===0;break;}
  }else{
   const blocked=s.actors.some(b=>b!==a&&b.side===a.side&&b.hp>0&&(b.x-a.x)*direction>0&&Math.abs(b.x-a.x)<21&&b.wait>0);
   if(!blocked)a.x+=direction*a.speed*dt*(a.slowTime>0?.55:1)*(a.side===0&&s.haste>0?1.65:1);
  }
 }
 for(const a of s.actors)if(a.hp<=0&&a.side===1)s.energy=Math.min(s.cap,s.energy+Math.round((a.cost||20)*KILL_RATIO)); // 擊殺敵人獲得靈力

// 倒下：HP 歸零後立刻停掉原本動作，改播倒下一次並停在最後一格，再淡出並升起靈魂

function updateFx(dt){
 for(const r of s.rings){r.t+=dt;r.spin+=dt*18;}
 s.rings=s.rings.filter(r=>r.t<RING_OUT+RING_BACK);

function drawDying(){
 for(const d of s.dying){
  const alpha=d.t<.9?1:Math.max(0,1-(d.t-.9)/.5);
  ctx.save();ctx.translate(d.x,floor);ctx.scale(d.side?-1:1,1);
  d.p.draw(ctx,0,0,{alpha});ctx.restore();

   const u=Math.min(1,(d.t-.25)/.7);ctx.save();ctx.globalAlpha=(1-u)*Math.min(1,u*6);

function drawRings(){

  const out=r.t<RING_OUT,u=out?r.t/RING_OUT:(r.t-RING_OUT)/RING_BACK;
